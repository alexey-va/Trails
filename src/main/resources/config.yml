# Trails configuration.
# Every duration and percentage includes its unit in the key.
config-version: 3

locale: en-US

commands:
  # Optional runtime alias in addition to /trails and /paths. Use an empty value to disable it.
  localized-alias: ''

player-defaults:
  trails-enabled: true
  speed-boost-enabled: true

worlds:
  # all: every world; allowlist: only names below; blocklist: every world except names below.
  mode: all
  names: []

trail-creation:
  while-sneaking: false
  sprint-progress-multiplier: 1.5
  require-permission: false
  strict-stage-order: false
  visualization-particle: NAUTILUS

speed-boost:
  require-permission: false
  only-created-trails: true
  update-interval-ticks: 1
  adjustment-step: 0.006
  remove-immediately-off-trail: false

tools:
  # Right-click a block to advance it. Permissions: trails.trail-tool and trails.trail-tool.bypass-protection.
  advance: IRON_SHOVEL
  # Right-click a block to inspect its trail metadata. Permission: trails.info-tool.
  inspect: STICK

decay:
  enabled: true
  interval-ticks: 1200
  chunk-selection-chance-percent: 20
  blocks-per-chunk-percent: 3
  minimum-player-distance-blocks: 5
  step-counter-reduction-percent: 10

messages:
  protection-denied:
    enabled: false
    cooldown-seconds: 10

storage:
  player-preferences-save-interval-minutes: 5

integrations:
  protection-events:
    # Also probe BlockPlaceEvent for claim plugins that do not inspect EntityChangeBlockEvent.
    block-place-compatibility: true

  coreprotect:
    log-block-changes: true
