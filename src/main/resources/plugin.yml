name: Trails
version: "${version}"
main: ru.ruscrafting.trails.TrailsPlugin
description: Naturally creates configurable paths where players walk.
api-version: "1.21.11"
authors: [j10max, ccrama, drkmatr1984, Mr-Deej, GrocerMC, alexey-va]
website: https://github.com/alexey-va/Trails
softdepend:
  - CoreProtect
  - PlaceholderAPI
commands:
  trails:
    description: Configure trail creation and trail speed boost.
    usage: /trails [on|off|boost|show|reload|status|validate|give|build]
    aliases: [paths]
permissions:
  trails.toggle:
    description: Toggle personal trail creation.
    default: true
  trails.other:
    description: Toggle trail creation for another player.
    default: op
  trails.create-trails:
    description: Create trails when permission-gated mode is enabled.
    default: false
  trails.boost:
    description: Receive trail speed boosts when permission-gated mode is enabled.
    default: false
  trails.toggle-boost:
    description: Toggle personal trail speed boost.
    default: true
  trails.toggle-boost.other:
    description: Toggle trail speed boost for another player.
    default: op
  trails.show:
    description: Visualize nearby trail blocks.
    default: op
  trails.reload:
    description: Reload Trails configuration and locales safely.
    default: op
  trails.status:
    description: Show active Trails configuration and integration status.
    default: op
  trails.validate:
    description: Validate Trails configuration without applying it.
    default: op
  trails.tools.give:
    description: Give tagged Trails inspect or advance tools.
    default: op
  trails.trail-tool:
    description: Advance a trail block with the configured tool.
    default: true
  trails.trail-tool.bypass-protection:
    description: Use the trail tool without protection checks.
    default: op
  trails.info-tool:
    description: Inspect trail metadata with the configured tool.
    default: true
  trails.roads.use:
    description: Preview, commit, cancel, and undo the player's own Roads plans.
    default: false
  trails.roads.manage:
    description: Manage Roads plans for other players as well as the sender.
    default: op
  trails.roads.bypass-protection:
    description: Commit or undo Roads plans without external protection-plugin checks.
    default: op
  trails.roads.collect-drops:
    description: Return ordinary blocks removed by a survival Roads commit.
    default: op
