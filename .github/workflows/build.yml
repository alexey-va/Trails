name: build

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.codex/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trails-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["25"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --no-daemon --build-cache test shadowJar verifyPluginArtifact

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Decay target budget is 229,200ms; retain 40,800ms for setup/diagnostics.
      TEST_TIMEOUT: "270000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Download immutable native cleanup provider
        run: |
          mkdir -p build/e2e-runtime
          curl --fail --location --retry 3 --output build/e2e-runtime/ArcCore-0.1.13.jar https://repo.rus-crafting.ru/grocermc/ru/ruscrafting/ArcCore/0.1.13/ArcCore-0.1.13.jar
          echo '952cca75616a433f7ee02ea0a0d078b4b88291dafd62e7acb415be3952dbef10  build/e2e-runtime/ArcCore-0.1.13.jar' | sha256sum --check --strict
      - name: Test Trails on real Paper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew --no-daemon plugwrightTest -Pe2eArcCoreJar=build/e2e-runtime/ArcCore-0.1.13.jar 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Upload E2E results and Paper logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trails-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
